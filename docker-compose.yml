version: '3.8'

# FTA/ETA Editor - Version 1.4.1
# Updated: 2025-11-21
# Includes: Web application interface, GUI application, resizable panels, zoom/pan

services:
  # Desktop GUI Application
  fta-editor:
    build:
      context: .
      dockerfile: Dockerfile
    image: fta-editor:1.4.1
    container_name: fta_editor_gui
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount data directory for input files
      - ./data:/app/data
      # Mount output directory for exports (create if not exists)
      - ./output:/app/output
      # X11 socket for GUI display (Linux/Mac only)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Web Application Service
  fta-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fta-editor:1.4.1
    container_name: fta_editor_web
    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "120", "web_app.app:app"]
    restart: unless-stopped
