services:
  - type: web
    name: fta-editor
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && apt-get update && apt-get install -y graphviz
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 web_app.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /
