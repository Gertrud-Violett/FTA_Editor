[pytest]
# importlib import mode: required because the vendored test copies under
# fta_web/tests/core/ share basenames with the frozen originals under
# desktop/tests/ (test_validator.py, test_eta_mode.py, ...). Under the legacy
# "prepend" mode pytest keys modules by basename and refuses the second one it
# sees with an "import file mismatch" error, so `pytest` from the repo root
# fails to collect. importlib mode keys by full path and both suites collect
# cleanly.
#
# The suites are still meaningfully separate (spec sections 13.1 / 13.2 / 13.3):
#   pytest fta_web/tests/      -- the web app (primary): vendored core + new suites
#   pytest desktop/tests/      -- the frozen legacy suite, run against desktop/src/
# This file only makes `pytest` with no arguments do the sensible thing too.
addopts = --import-mode=importlib
testpaths = fta_web/tests desktop/tests
filterwarnings =
    ignore::DeprecationWarning:google
